<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stick War 1</title>
    <style>
        body { 
            margin: 0; 
            background: #000; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            overflow: hidden;
        }
        #flash-game { 
            width: 800px; 
            height: 600px; 
        }
    </style>
</head>
<body>

    <!-- Target file must be named exactly Stick_War_1.swf -->
    <object id="flash-game" data="Stick_War_1.swf" type="application/x-shockwave-flash">
        <param name="movie" value="Stick_War_1.swf">
        <param name="allowScriptAccess" value="always">
        <param name="allowFullScreen" value="true">
    </style>
    </object>

    <!-- Ruffle auto-polyfill script -->
    <script src="https://unpkg.com"></script>

    <script>
        window.RufflePlayer = window.RufflePlayer || {};
        window.RufflePlayer.config = {
            "autoplay": "on",
            "splashScreen": false,
            "unmuteOverlay": "hidden"
        };
    </script>

</body>
</html>
